  nell'header (assets/img/granarolo-logo-original.svg / index.html,
  <a class="brand">). Non è un disegno nuovo: sono gli stessi due path
  vettoriali dell'originale (la pancia arrotondata della lettera + il
  piccolo tratto diagonale che la chiude a "G"), solo con viewBox
  ritagliato intorno a quella lettera e riempimento verde brand fisso
  (i favicon vengono letti dal browser fuori dal contesto della pagina,
  quindi non possono leggere le custom property CSS del sito come fa
  invece il logo inline nell'header).
-->
